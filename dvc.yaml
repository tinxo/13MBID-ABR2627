stages:
  visualize_data:
    cmd: python src/data_visualization.py
    deps:
      - src/data_visualization.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - docs/figures/distribucion_sentimiento.png
      - docs/figures/longitud_texto.png
      - docs/figures/matriz_correlaciones_clientes.png
      - docs/figures/matriz_correlaciones_resenas.png

  test_data_quality:
    cmd: pytest --html=docs/reporte_calidad_datos.html --self-contained-html test/test_data_quality.py -v || true
    deps:
      - test/test_data_quality.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - docs/reporte_calidad_datos.html

  data_prep:
    cmd: python src/data_prep.py
    deps:
      - src/data_prep.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - data/processed/datos_integrados.csv
  
  train_model:
    cmd: python src/train_model.py
    deps:
      - src/train_model.py
      - data/processed/datos_integrados.csv
    outs:
      - models/trained_model.pkl
      - models/preprocessor.pkl
      - docs/figures/confusion_matrix_test.png
    metrics:
      - metrics/train_metrics.json

  test_model:
    cmd: pytest --html=docs/reporte_pruebas_modelo.html --self-contained-html test/test_train.py -v || true
    deps:
      - test/test_train.py
      - metrics/train_metrics.json
      - data/processed/datos_integrados.csv
    outs:
      - docs/reporte_pruebas_modelo.html